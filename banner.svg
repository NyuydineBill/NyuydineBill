<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0a1a2f;#0d1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0a1a2f">
        <animate attributeName="stop-color" values="#0a1a2f;#131b2e;#0a1a2f" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0f172a;#0d1117" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="380" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bgGrad)"/>

    <!-- floating particles -->
    <g fill="#38bdf8">
      <circle cx="90" cy="300" r="3" opacity="0.6">
        <animate attributeName="cy" values="300;250;300" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="80" r="2.5" opacity="0.5" fill="#a78bfa">
        <animate attributeName="cy" values="80;40;80" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="60" r="3" opacity="0.5">
        <animate attributeName="cy" values="60;110;60" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="280" r="2" opacity="0.55" fill="#a78bfa">
        <animate attributeName="cy" values="280;230;280" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.1;0.55" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="50" r="2.5" opacity="0.45">
        <animate attributeName="cy" values="50;90;50" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="350" cy="320" r="2" opacity="0.4" fill="#a78bfa">
        <animate attributeName="cy" values="320;280;320" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- greeting -->
    <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="4">
      HI THERE, I'M
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- title -->
    <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">
      Nyuydine Bill Leynyuy
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- cycling subtitle -->
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#e6edf3" text-anchor="middle">
      <text x="600" y="260" opacity="0">
        Senior Full-Stack Software Engineer
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.28;0.33" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="260" opacity="0">
        AI / LLM Engineer
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.28;0.33" dur="9s" begin="4.5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="260" opacity="0">
        Founder @ ResolveMeQ &amp; JotEcho
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.28;0.33" dur="9s" begin="7.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="850" y="240" width="3" height="26" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="600" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" opacity="0">
      Building AI-powered products, from idea to production 🚀
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.6s" fill="freeze"/>
    </text>

    <!-- animated waves at the bottom -->
    <g>
      <path fill="url(#waveGrad1)" d="M0,340 C150,320 300,360 450,340 C600,320 750,360 900,340 C1050,320 1150,340 1200,335 L1200,380 L0,380 Z">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="
            M0,340 C150,320 300,360 450,340 C600,320 750,360 900,340 C1050,320 1150,340 1200,335 L1200,380 L0,380 Z;
            M0,335 C150,360 300,320 450,340 C600,360 750,320 900,340 C1050,360 1150,335 1200,340 L1200,380 L0,380 Z;
            M0,340 C150,320 300,360 450,340 C600,320 750,360 900,340 C1050,320 1150,340 1200,335 L1200,380 L0,380 Z
          "/>
      </path>
      <path fill="url(#waveGrad2)" d="M0,360 C200,340 400,375 600,358 C800,342 1000,372 1200,355 L1200,380 L0,380 Z">
        <animate attributeName="d" dur="9s" repeatCount="indefinite"
          values="
            M0,360 C200,340 400,375 600,358 C800,342 1000,372 1200,355 L1200,380 L0,380 Z;
            M0,355 C200,375 400,340 600,358 C800,375 1000,340 1200,360 L1200,380 L0,380 Z;
            M0,360 C200,340 400,375 600,358 C800,342 1000,372 1200,355 L1200,380 L0,380 Z
          "/>
      </path>
    </g>

    <!-- frame border glow -->
    <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
